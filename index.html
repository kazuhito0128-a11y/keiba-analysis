<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17202a"><link rel="manifest" href="manifest.json">
<title>競馬分析 v2.3</title>
<style>
body{margin:0;background:#f3f5f7;color:#17202a;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}header{background:#17202a;color:#fff;padding:14px;position:sticky;top:0;z-index:5}h1{font-size:18px;margin:0}.sub{font-size:10px;opacity:.75}main{max-width:1050px;margin:auto;padding:10px}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 9px #0001}h2{font-size:15px;margin:0 0 10px}.notice,.status{font-size:10px;line-height:1.6;background:#f8fafc;padding:9px;border-radius:9px}textarea,input,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #d0d5dd;border-radius:9px;margin-top:5px;font:inherit}textarea{min-height:180px;font-size:11px}.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}button{border:0;border-radius:10px;padding:11px 12px;background:#1769e0;color:#fff;font-weight:700;flex:1;min-width:120px}.secondary{background:#475467}.hidden{display:none}.good{color:#087443;font-weight:700}.warn{color:#b54708;font-weight:700}.bad{color:#b42318;font-weight:700}table{width:100%;border-collapse:collapse;font-size:10px}th,td{padding:6px;border-bottom:1px solid #eee;text-align:left}.rank{display:grid;grid-template-columns:38px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid #eee}.num{font-size:20px;font-weight:900}.horse{font-weight:800;font-size:13px}.tag{font-size:9px;background:#eef2ff;border-radius:99px;padding:4px 6px;display:inline-block;margin:2px}.hot{background:#fff1f0}.muted{font-size:10px;color:#667085;line-height:1.5}.comment{border-left:3px solid #1769e0;background:#f8fafc;padding:8px;margin:6px 0;font-size:11px;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>🐴 競馬分析 v2.3</h1><div class="sub">JRA出馬表そのまま貼り付け対応</div></header><main>
<section class="card"><h2>① レース指定</h2><div class="grid">
<div><label>日付</label><input id="date" type="date"></div><div><label>競馬場</label><select id="track"><option>中山</option><option>東京</option><option>阪神</option><option>京都</option><option>福島</option><option>新潟</option><option>中京</option><option>札幌</option><option>函館</option><option>小倉</option></select></div>
<div><label>R</label><select id="race"></select></div><div><label>距離(m)</label><input id="distance" type="number" value="1200"></div></div></section>

<section class="card"><h2>② JRA出馬表をそのまま貼り付け</h2>
<div class="notice"><strong>URLではなく、JRA出馬表の文字をそのまま貼り付けます。</strong><br>[馬名](URL)、**オッズ**、▲△、取消などが混ざっていてもOKです。</div>
<textarea id="source" placeholder="JRA出馬表をここに貼り付け"></textarea>
<div class="row"><button onclick="parseJRA()">🔎 自動抽出</button><button class="secondary" onclick="sample()">🧪 サンプル</button><button class="secondary" onclick="clearAll()">🗑 クリア</button></div><div id="status" class="status">待機中</div></section>

<section id="preview" class="card hidden"><h2>③ 抽出結果を確認</h2><div id="summary" class="status"></div><div id="table"></div><div class="row"><button onclick="runAnalysis()">🏆 分析開始</button></div></section>

<section id="analysis" class="hidden"><section class="card"><h2>🏆 おすすめ順</h2><div id="ranking"></div></section>
<section class="card"><h2>🔥 条件変化チェック</h2><div id="changes"></div></section><section class="card"><h2>⏱ 1000m予想</h2><div id="time"></div><div class="muted">※現段階は距離・過去走を利用した暫定値です。</div></section>
<section class="card"><h2>🏇 展開予想</h2><div id="flow"></div></section><section class="card"><h2>💬 馬体・厩舎・騎手</h2><div id="comments"></div></section>
<section class="card"><h2>🏁 答え合わせ</h2><textarea id="result" placeholder="例：1着 3 / 2着 8 / 3着 5"></textarea><button onclick="review()">答え合わせ</button><div id="review"></div></section></section>
</main>
<script>
let horses=[],predicted=[];const $=id=>document.getElementById(id);
for(let i=1;i<=12;i++){let o=document.createElement("option");o.value=i;o.textContent=i+"R";$("race").appendChild(o)}$("date").value=new Date().toISOString().slice(0,10);
function clean(s){return s.replace(/\r/g,"").replace(/\u00a0/g," ").replace(/\*\*/g,"").replace(/\[([^\]]+)\]\([^)]+\)/g,"$1").replace(/https?:\/\/\S+/g,"").replace(/[ \t]+/g," ").trim()}
function isHorseName(s){if(!s||s.length<2||s.length>30)return false;if(/^(枠|馬名|勝負服|父|母|牡|牝|せん|取消|前走|前々走|3走前|4走前)/.test(s))return false;if(/^\d/.test(s)||/kg$/.test(s)||/番人気/.test(s))return false;return /[一-龥々ぁ-んァ-ヶ]/.test(s)}
function isPersonName(s){if(!s||s.length<2||s.length>12)return false;if(/牧場|ファーム|クラブ|美浦|栗東|馬主|生産|父：|母：|頭$|着$|人気|芝|ダ|良|重|稍/.test(s))return false;return /^[一-龥々ぁ-んァ-ヶ・]+(?:\s+[一-龥々ぁ-んァ-ヶ・]+)?$/.test(s)}
function parseJRA(){
 const lines=$("source").value.split(/\n/).map(clean).filter(Boolean);let out=[];
 for(let i=0;i<lines.length;i++){let nm=lines[i].match(/^(\d{1,2})$/);if(!nm)continue;let no=+nm[1];if(no<1||no>18)continue;let j=i+1;while(j<lines.length&&/^枠[1-8]/.test(lines[j]))j++;
  if(lines[j]==="取消"){out.push({no,name:"取消",cancel:true,tags:[]});continue}if(!isHorseName(lines[j]))continue;let name=lines[j];j++;
  let end=j;while(end<lines.length&&!/^\d{1,2}$/.test(lines[end]))end++;let block=lines.slice(j,end);
  let odds=null,pop=null,body=null,diff=0,wt=null,jockey="",trainer="",father="",mother="",sexage="";
  for(const s of block){let o=s.match(/^(\d+(?:\.\d+)?)\s*\((\d+)番人気\)$/);if(o&&odds===null){odds=+o[1];pop=+o[2]}let b=s.match(/^(\d{3})kg(?:\s*\(([+-]?\d+)\))?$/);if(b&&body===null){body=+b[1];diff=+(b[2]||0)}let w=s.match(/^[▲△★◇]?\s*(\d{2}(?:\.\d+)?)kg$/);if(w&&wt===null)wt=+w[1];if(/^(牡|牝|せん)\d+\/.+/.test(s))sexage=s;if(/\(美浦\)|\(栗東\)/.test(s))trainer=s;if(/^-\s*父[：:]/.test(s))father=s;if(/^-\s*母[：:]/.test(s))mother=s}
  let wi=block.findIndex(s=>/^[▲△★◇]?\s*\d{2}(?:\.\d+)?kg$/.test(s));if(wi>0)for(let k=wi-1;k>=Math.max(0,wi-4);k--){let s=block[k];if(isPersonName(s)&&s!==trainer){jockey=s;break}}
  let tags=[],ctx=block.join(" ");if(/初ブリンカー|初B|ブリンカー着用/.test(ctx))tags.push("初ブリンカー");if(/芝からダート|芝→ダート/.test(ctx))tags.push("芝→ダート初戦");if(/ダートから芝|ダート→芝/.test(ctx))tags.push("ダート→芝初戦");if(/障害から平地|障害→平地/.test(ctx))tags.push("障害→平地初戦");
  out.push({no,name,odds,pop,body,diff,wt,jockey,trainer,father,mother,sexage,tags,cancel:false});
 }
 const seen=new Set();horses=out.filter(h=>!seen.has(h.no)&&seen.add(h.no));if(!horses.length){$("status").innerHTML='<span class="bad">抽出できませんでした。</span>';return}renderPreview()
}
function renderPreview(){let a=horses.filter(h=>!h.cancel),c=horses.filter(h=>h.cancel),bad=a.filter(h=>!h.jockey||h.odds===null||h.body===null).length;
 $("summary").innerHTML=`<span class="good">抽出 ${horses.length}頭</span>　出走 ${a.length}頭　取消 ${c.length}頭　`+(bad?`<span class="warn">確認が必要 ${bad}頭</span>`:'<span class="good">主要項目OK</span>');
 $("table").innerHTML="<table><tr><th>番</th><th>馬名</th><th>オッズ</th><th>馬体重</th><th>斤量</th><th>騎手</th><th>厩舎</th><th>条件変化</th></tr>"+horses.map(h=>`<tr><td>${h.no}</td><td>${h.name}</td><td>${h.cancel?"取消":h.odds??"—"}</td><td>${h.body?`${h.body}kg ${h.diff>=0?"+":""}${h.diff}`:"—"}</td><td>${h.wt??"—"}kg</td><td>${h.jockey||"—"}</td><td>${h.trainer||"—"}</td><td>${h.tags.map(x=>"🔥"+x).join(" ")||"—"}</td></tr>`).join("")+"</table>";$("preview").classList.remove("hidden");$("status").innerHTML='<span class="good">自動抽出しました。</span> 抽出結果を確認してください。'}
function runAnalysis(){let a=horses.filter(h=>!h.cancel);a.forEach(h=>{let s=h.odds?Math.max(1,20-Math.log(h.odds+1)*4):5;if(Math.abs(h.diff)>=8)s+=3;s+=h.tags.length*4;h.score=s});predicted=[...a].sort((x,y)=>y.score-x.score);
 $("ranking").innerHTML=predicted.map((h,i)=>`<div class="rank"><div class="num">${i+1}</div><div><div class="horse">${h.no} ${h.name}</div><span class="tag">指数 ${h.score.toFixed(1)}</span>${h.tags.map(t=>`<span class="tag hot">🔥${t}</span>`).join("")}<div class="muted">オッズ ${h.odds??"—"}｜馬体 ${h.body??"—"}kg (${h.diff>=0?"+":""}${h.diff||0})｜斤量 ${h.wt??"—"}kg｜騎手 ${h.jockey||"—"}</div></div></div>`).join("");
 $("changes").innerHTML=predicted.filter(h=>h.tags.length).map(h=>`<div class="comment"><b>${h.no} ${h.name}</b>：${h.tags.join("／")}</div>`).join("")||"該当馬なし";$("time").textContent=`${(+$("distance").value||1200)===1200?"57.0～59.0":"距離に応じた暫定レンジ"} 秒前後`;
 $("flow").innerHTML=["スタート直後","向こう正面","第3コーナー","ゴール前"].map(x=>`<div class="comment"><b>${x}</b>：過去走の位置取り・脚質から推定する欄</div>`).join("");
 $("comments").innerHTML=predicted.map(h=>`<div class="comment"><b>${h.no} ${h.name}</b><br>馬体重：${h.body??"—"}kg (${h.diff>=0?"+":""}${h.diff||0})<br>厩舎：${h.trainer||"—"}<br>騎手：${h.jockey||"—"}<br>${h.father||""}<br>${h.mother||""}</div>`).join("");$("analysis").classList.remove("hidden")}
function review(){let a=[...$("result").value.matchAll(/(?:^|\s|,|、|\/)(\d{1,2})\s*(?:着|位)/g)].map(m=>m[1]);if(!a.length){$("review").textContent="「1着 3 / 2着 8 / 3着 5」の形式で入力してください。";return}let p=predicted.slice(0,3).map(h=>String(h.no));$("review").innerHTML=`<div class="comment">予想TOP3：${p.join(" → ")}<br>実績TOP3：${a.slice(0,3).join(" → ")}<br>TOP3一致：${p.filter(x=>a.slice(0,3).includes(x)).length}/3</div>`}
function sample(){$("source").value=`枠1白\n1\n[ドナチャージ](https://example.com)\n**28.4**(6番人気)\n406kg(0)\n小川 眞査雄\n清水牧場\n[栗田 徹](https://example.com)(美浦)\n- 父：ウィルテイクチャージ\n- 母：ドナルチア(母の父：Malibu Moon)\n牝2/栗\n55.0kg\n[杉原 誠人](https://example.com)\n2026年7月19日\n福島\n新馬\n5着\n枠1白\n2\n[エコロブラン](https://example.com)\n**2.7**(1番人気)\n428kg(0)\n原村 正紀\n社台ファーム\n[中舘 英二](https://example.com)(美浦)\n- 父：ミスチヴィアスアレックス\n- 母：グラッブユアダイヤ(母の父：ゴールドアリュール)\n牝2/黒鹿\n55.0kg\n[津村 明秀](https://example.com)`;parseJRA()}
function clearAll(){$("source").value="";horses=[];predicted=[];$("preview").classList.add("hidden");$("analysis").classList.add("hidden");$("status").textContent="クリアしました。"}
</script></body></html>
